<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b0d1d"><title>Star Miner</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:radial-gradient(circle at 20% 0,#293463,#10142b 38%,#070913);user-select:none}button{font:inherit;border:0;color:inherit}.app{height:100%;max-width:520px;margin:auto;padding:14px 15px max(13px,env(safe-area-inset-bottom));padding-top:max(14px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:10px}.top{display:flex;justify-content:space-between;align-items:center}.logo{display:flex;align-items:center;gap:9px}.icon{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:25px;background:linear-gradient(145deg,#302c68,#6149c0);box-shadow:0 10px 28px #0006}.logo h1{font-size:24px}.logo small{display:block;color:#9298b8;font-size:9px;letter-spacing:1.4px}.wallet{display:flex;gap:5px}.coin,.card,.nav button{background:#ffffff0d;border:1px solid #ffffff1c;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}.coin{padding:7px 8px;border-radius:13px;text-align:center;min-width:62px}.coin span{display:block;color:#9298b8;font-size:8px}.coin b{font-size:13px}.card{border-radius:21px;box-shadow:0 18px 55px #0005}.ship{padding:14px}.shiphead{display:flex;justify-content:space-between}.shipname{font-size:18px;font-weight:850}.sub{color:#9298b8;font-size:10px;margin-top:3px}.status{font-size:9px;color:#57e5ad;background:#57e5ad12;border:1px solid #57e5ad25;padding:5px 8px;border-radius:9px}.visual{height:100px;display:grid;place-items:center}.rocket{font-size:66px;filter:drop-shadow(0 0 22px #55dfff99);animation:f 3s ease-in-out infinite}@keyframes f{50%{transform:translateY(-5px) rotate(-2deg)}}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.s{padding:8px;background:#0002;border-radius:13px}.s small{display:block;color:#9298b8;font-size:9px;margin-bottom:4px}.bar{height:5px;background:#fff1;border-radius:8px}.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#8972ff,#54d9ff)}.mine{padding:14px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.head h2{font-size:15px}.head span{font-size:9px;color:#9298b8}.asteroids{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.ast{padding:7px 2px;min-height:75px;border-radius:14px;background:#ffffff08;border:1px solid transparent}.ast.selected{border-color:#8b72ff99;background:#8b72ff1c}.rock{display:block;font-size:27px}.ast b{font-size:9px;display:block}.ast small{font-size:8px;color:#9298b8}.loot{display:flex;justify-content:space-between;color:#9298b8;font-size:10px;margin-top:9px}.loot b{color:#fff}.action{width:100%;min-height:48px;margin-top:10px;border-radius:16px;background:linear-gradient(135deg,#6c63ef,#9c50e7);font-weight:850;box-shadow:0 10px 28px #765bf044}.action:active{transform:scale(.98)}.action:disabled{opacity:.45}.progress{display:none;margin-top:9px}.progress.show{display:block}.prow{display:flex;justify-content:space-between;color:#9298b8;font-size:10px;margin-bottom:5px}.pbar{height:7px;background:#fff1;border-radius:8px;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#54d9ff,#8b72ff)}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:auto}.nav button{min-height:43px;border-radius:14px;font-size:11px;font-weight:750;color:#cbd0e5}.modal{position:fixed;inset:0;z-index:10;background:#050714b8;backdrop-filter:blur(15px);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:.2s}.modal.show{opacity:1;pointer-events:auto}.modalcard{width:min(100%,390px);padding:19px;border-radius:24px;background:#171a36f5;border:1px solid #ffffff1c}.mh{display:flex;justify-content:space-between;margin-bottom:14px}.close{width:34px;height:34px;border-radius:11px;background:#fff1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px;border-radius:14px;background:#fff08}.stat small{display:block;color:#9298b8;font-size:9px}.stat b{font-size:18px}.upgrade{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#fff08;border-radius:14px;margin-top:8px}.upgrade p{font-size:12px}.upgrade small{display:block;color:#9298b8;font-size:9px}.upgrade button{padding:9px 11px;border-radius:11px;background:#7564ee;font-size:10px;font-weight:800}.toast{position:fixed;z-index:30;left:50%;bottom:80px;transform:translate(-50%,15px);opacity:0;background:#1d2142ee;border:1px solid #ffffff1c;padding:10px 14px;border-radius:13px;font-size:11px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-height:690px){.visual{height:72px}.rocket{font-size:50px}.ast{min-height:65px}}
</style></head><body><div class="app">
<div class="top"><div class="logo"><div class="icon">🚀</div><div><h1>STAR MINER</h1><small>КОСМИЧЕСКАЯ ДОБЫЧА</small></div></div><div class="wallet"><div class="coin"><span>💰</span><b id="credits">0</b></div><div class="coin"><span>💎</span><b id="crystals">0</b></div></div></div>
<div class="card ship"><div class="shiphead"><div><div class="shipname">STAR MINER I</div><div class="sub" id="level">Уровень 1 • Малый добывающий корабль</div></div><div class="status" id="status">ГОТОВ</div></div><div class="visual"><div class="rocket">🚀</div></div><div class="stats"><div class="s"><small>⛏ Бур</small><b id="drill">10</b><div class="bar"><i id="drillbar"></i></div></div><div class="s"><small>📦 Трюм</small><b id="cargo">100</b><div class="bar"><i id="cargobar"></i></div></div><div class="s"><small>⚡ Энергия</small><b id="energy">100</b><div class="bar"><i id="energybar"></i></div></div></div></div>
<div class="card mine"><div class="head"><h2>☄️ Астероидное поле</h2><span>Sol • Сектор 01</span></div><div class="asteroids" id="asteroids"></div><div class="loot"><span>Богатство: <b id="rich">—</b></span><span>Опасность: <b id="danger">—</b></span></div><button class="action" id="mine">⛏ НАЧАТЬ ДОБЫЧУ</button><div class="progress" id="progress"><div class="prow"><span>Добыча ресурсов...</span><span id="timer">0:00</span></div><div class="pbar"><i id="pbar"></i></div></div></div>
<div class="nav"><button id="fleet">🚀 Флот</button><button id="upgrades">🔧 Улучшения</button><button id="statistics">📊 Статистика</button></div></div>
<div class="modal" id="modal"><div class="modalcard"><div class="mh"><h2 id="mtitle"></h2><button class="close" id="close">×</button></div><div id="mbody"></div></div></div><div class="toast" id="toast"></div>
<script>
(()=>{const tg=window.Telegram?.WebApp||null,KEY="star_miner_v1",A=[["🪨","Каменный",8,55,5,35,70,2,8,0,2],["☄️","Металлический",10,72,10,60,120,8,18,1,4],["🌑","Титановый",13,86,16,80,150,20,40,2,7],["💠","Кристальный",16,94,24,70,130,18,35,7,16],["🪐","Аномалия",22,100,38,100,190,30,55,12,30]];let s={credits:1000,crystals:0,iron:0,titan:0,ship:{level:1,drill:10,cargo:100,energy:100},selected:1,mining:null,stats:{mines:0,iron:0,titan:0,crystals:0}},timer,toastTimer;const $=x=>document.getElementById(x);const fmt=n=>Math.floor(n).toLocaleString("ru-RU");function save(){localStorage.setItem(KEY,JSON.stringify(s))}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x)s={...s,...x,ship:{...s.ship,...x.ship},stats:{...s.stats,...x.stats}}}catch(e){}}function hap(t="light"){try{tg?.HapticFeedback?.impactOccurred(t)}catch(e){}}function toast(x){$("toast").textContent=x;$("toast").classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.remove("show"),1800)}function wallet(){$("credits").textContent=fmt(s.credits);$("crystals").textContent=fmt(s.crystals)}function ship(){let x=s.ship;$("level").textContent=`Уровень ${x.level} • ${x.level>=5?"Продвинутый":"Малый"} добывающий корабль`;$("drill").textContent=x.drill;$("cargo").textContent=x.cargo;$("energy").textContent=x.energy;$("drillbar").style.width=Math.min(100,x.drill/50*100)+"%";$("cargobar").style.width=Math.min(100,x.cargo/500*100)+"%";$("energybar").style.width=x.energy+"%"}function asteroids(){ $("asteroids").innerHTML=A.map((a,i)=>`<button class="ast ${i===s.selected?"selected":""}" data-i="${i}"><span class="rock">${a[0]}</span><b>${a[1]}</b><small>${a[2]} сек</small></button>`).join("");document.querySelectorAll(".ast").forEach(b=>b.onclick=()=>{if(!s.mining){s.selected=+b.dataset.i;asteroids();info();hap()}})}function info(){let a=A[s.selected];$("rich").textContent=a[3]+"%";$("danger").textContent=a[4]+"%"}function render(){wallet();ship();asteroids();info();if(s.mining)resume()}function mine(){if(s.mining)return;let a=A[s.selected],d=Math.max(5,a[2]-Math.floor(s.ship.drill/12));s.mining={started:Date.now(),duration:d,a:s.selected};$("mine").disabled=true;$("mine").textContent="⛏ ДОБЫЧА ИДЁТ...";$("status").textContent="ДОБЫЧА";$("progress").classList.add("show");save();hap("medium");tick()}function resume(){clearInterval(timer);$("mine").disabled=true;$("mine").textContent="⛏ ДОБЫЧА ИДЁТ...";$("status").textContent="ДОБЫЧА";$("progress").classList.add("show");timer=setInterval(tick,250);tick()}function tick(){if(!s.mining)return;let e=(Date.now()-s.mining.started)/1000,p=Math.min(1,e/s.mining.duration),l=Math.max(0,Math.ceil(s.mining.duration-e));$("pbar").style.width=p*100+"%";$("timer").textContent=Math.floor(l/60)+":"+String(l%60).padStart(2,"0");if(p>=1)finish()}function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function finish(){clearInterval(timer);let a=A[s.mining.a],f=Math.min(1,s.ship.cargo/(a[5]+a[7]+a[9])),iron=Math.max(1,Math.floor(rand(a[5],a[6])*f)),titan=Math.max(0,Math.floor(rand(a[7],a[8])*f)),cr=Math.max(0,Math.floor(rand(a[9],a[10])*f)),money=iron*2+titan*6+cr*25;s.iron+=iron;s.titan+=titan;s.crystals+=cr;s.credits+=money;s.stats.mines++;s.stats.iron+=iron;s.stats.titan+=titan;s.stats.crystals+=cr;s.mining=null;$("mine").disabled=false;$("mine").textContent="⛏ НАЧАТЬ ДОБЫЧУ";$("status").textContent="ГОТОВ";$("progress").classList.remove("show");save();wallet();hap("medium");toast(`📦 +${fmt(money)} кредитов • 💎 +${cr}`)}function modal(t,b){$("mtitle").textContent=t;$("mbody").innerHTML=b;$("modal").classList.add("show")}function upgrades(){let x=s.ship,p={drill:250*x.level,cargo:300*x.level,energy:220*x.level};modal("🔧 Улучшения",`<div class="upgrade"><div><p>⛏ Бур +5</p><small>Сокращает время добычи</small></div><button data-u="drill">💰 ${fmt(p.drill)}</button></div><div class="upgrade"><div><p>📦 Трюм +50</p><small>Больше ресурсов за рейс</small></div><button data-u="cargo">💰 ${fmt(p.cargo)}</button></div><div class="upgrade"><div><p>⚡ Энергия +10</p><small>Резерв энергии корабля</small></div><button data-u="energy">💰 ${fmt(p.energy)}</button></div>`);document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>buy(b.dataset.u,p[b.dataset.u]))}function buy(k,p){if(s.credits<p){toast("💰 Не хватает кредитов");hap("heavy");return}s.credits-=p;s.ship[k]+=k==="drill"?5:k==="cargo"?50:10;s.ship.level=Math.floor(((s.ship.drill-10)/5+(s.ship.cargo-100)/50+(s.ship.energy-100)/10)/3)+1;save();wallet();ship();upgrades();hap("medium");toast("🔧 Корабль улучшен")}function stats(){modal("📊 Статистика",`<div class="grid"><div class="stat"><small>Экспедиций</small><b>${fmt(s.stats.mines)}</b></div><div class="stat"><small>Уровень корабля</small><b>${s.ship.level}</b></div><div class="stat"><small>🔩 Железо</small><b>${fmt(s.stats.iron)}</b></div><div class="stat"><small>🪨 Титан</small><b>${fmt(s.stats.titan)}</b></div><div class="stat"><small>💎 Кристаллы</small><b>${fmt(s.stats.crystals)}</b></div><div class="stat"><small>💰 Кредиты</small><b>${fmt(s.credits)}</b></div></div>`)}function fleet(){modal("🚀 Флот",`<div style="text-align:center;padding:18px 5px"><div style="font-size:60px">🚀</div><h3>STAR MINER I</h3><p style="color:#9298b8;font-size:12px;margin-top:7px">Новые корабли и параллельные экспедиции появятся в следующей версии.</p></div>`)}$("mine").onclick=mine;$("upgrades").onclick=upgrades;$("statistics").onclick=stats;$("fleet").onclick=fleet;$("close").onclick=()=>$("modal").classList.remove("show");$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("show")};document.addEventListener("visibilitychange",()=>{if(document.hidden)save();else if(s.mining)resume()});try{tg?.ready();tg?.expand();tg?.BackButton?.onClick(()=>tg.close());tg?.BackButton?.show()}catch(e){}load();render()})();
</script></body></html>
