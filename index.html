<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>Star Miner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#05060f;user-select:none;position:relative}
#stars-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 20% 0%, #1a1f4a 0%, transparent 50%),radial-gradient(ellipse at 80% 100%, #2a1650 0%, transparent 50%),linear-gradient(180deg, #05060f 0%, #0a0d24 50%, #05060f 100%)}
#stars-bg::before,#stars-bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%, #fff, transparent),radial-gradient(1px 1px at 60% 70%, #fff, transparent),radial-gradient(2px 2px at 80% 20%, #c4b5ff, transparent),radial-gradient(1px 1px at 10% 80%, #fff, transparent),radial-gradient(1.5px 1.5px at 45% 15%, #8de8ff, transparent);background-size:800px 800px;opacity:0.7;animation:stars-drift 120s linear infinite}
#stars-bg::after{background-size:400px 400px;opacity:0.4;animation:stars-drift 80s linear infinite reverse}
@keyframes stars-drift{from{background-position:0 0}to{background-position:800px 800px}}
button{font:inherit;border:0;color:inherit;cursor:pointer;background:none}
.app{position:relative;z-index:1;height:100%;max-width:520px;margin:auto;padding:14px 15px max(13px,env(safe-area-inset-bottom));padding-top:max(14px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding-bottom:100px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:9px;min-width:0}
.icon{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,#4b3aa8,#8b4ee0);box-shadow:0 8px 24px #7b52ff4d, inset 0 1px 0 #ffffff2e;flex-shrink:0}
.logo h1{font-size:20px;font-weight:900;letter-spacing:-0.5px;background:linear-gradient(135deg,#fff,#b8a8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;color:#7d84b0;font-size:8.5px;letter-spacing:1.2px;font-weight:600;margin-top:1px}
.wallet{display:flex;gap:6px;flex-shrink:0}
.coin{padding:7px 10px;border-radius:12px;text-align:center;min-width:64px;background:linear-gradient(180deg,#ffffff10,#ffffff05);border:1px solid #ffffff1a;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.coin span{display:block;color:#7d84b0;font-size:8px;margin-bottom:1px}
.coin b{font-size:13px;font-weight:800;color:#fff}
.xp-card{padding:12px 14px;border-radius:16px;background:linear-gradient(90deg,#8b72ff22,#54d9ff22);border:1px solid #8b72ff44}
.xp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.xp-head .lvl{font-size:13px;font-weight:900}
.xp-head .lvl .n{color:#ffd966}
.xp-head .xp{font-size:10px;color:#cbd0e5;font-weight:700}
.xp-bar{height:6px;background:#00000040;border-radius:6px;overflow:hidden}
.xp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd966,#ff7bd5);transition:width .4s;box-shadow:0 0 10px #ffd96688}
.tutorial-tip{padding:9px 12px;border-radius:12px;background:linear-gradient(90deg,#8b72ff18,#54d9ff18);border:1px solid #8b72ff44;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;line-height:1.4;color:#cbd0e5;animation:tip-appear .4s ease-out}
@keyframes tip-appear{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.tutorial-tip .tip-text{flex:1}
.tutorial-tip .tip-text b{color:#fff}
.tutorial-tip .tip-close{width:22px;height:22px;border-radius:7px;background:#ffffff10;color:#7d84b0;font-size:14px;line-height:1;flex-shrink:0;display:grid;place-items:center}
.event-banner{padding:10px 14px;border-radius:14px;background:linear-gradient(90deg,#ff7bd533,#ffd96633);border:1px solid #ff7bd555;display:flex;justify-content:space-between;align-items:center;gap:8px;animation:event-pulse 2s ease-in-out infinite}
@keyframes event-pulse{0%,100%{box-shadow:0 0 0 #ff7bd500}50%{box-shadow:0 0 20px #ff7bd566}}
.event-banner .etxt{font-size:11px;font-weight:800;color:#ffb8e8}
.event-banner .etimer{font-size:10px;color:#ffd966;font-weight:800}
.card{border-radius:22px;background:linear-gradient(180deg,#ffffff0f,#ffffff05);border:1px solid #ffffff1a;box-shadow:0 12px 40px #00000055, inset 0 1px 0 #ffffff1a;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#ffffff33,transparent)}
.ship{padding:14px}
.shiphead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.shipname{font-size:17px;font-weight:900;letter-spacing:-0.3px;background:linear-gradient(135deg,#fff,#a99dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#7d84b0;font-size:9.5px;margin-top:3px}
.status{font-size:9px;font-weight:800;letter-spacing:0.5px;color:#57e5ad;background:#57e5ad15;border:1px solid #57e5ad30;padding:5px 9px;border-radius:9px;white-space:nowrap}
.status.busy{color:#ffb84d;background:#ffb84d15;border-color:#ffb84d30}
.status.boost{color:#ff7bd5;background:#ff7bd515;border-color:#ff7bd540;box-shadow:0 0 12px #ff7bd540}
.visual{height:100px;display:grid;place-items:center;position:relative}
.visual::before{content:"";position:absolute;width:180px;height:60px;background:radial-gradient(ellipse,#8b72ff33,transparent 70%);filter:blur(10px)}
.rocket{font-size:64px;position:relative;filter:drop-shadow(0 0 24px #55dfffaa) drop-shadow(0 0 40px #8b72ff66);animation:float 3.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:4px}
.s{padding:9px 8px;background:#00000040;border-radius:12px;border:1px solid #ffffff0d}
.s small{display:block;color:#7d84b0;font-size:8.5px;margin-bottom:5px;font-weight:600}
.s b{font-size:14px;font-weight:800}
.bar{height:4px;background:#ffffff10;border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#8972ff,#54d9ff);transition:width .3s;box-shadow:0 0 6px #54d9ff88}
.bar.warn i{background:linear-gradient(90deg,#ff6b6b,#ffb84d)}
.bar.warn{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.mine{padding:14px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.head h2{font-size:14px;font-weight:800;letter-spacing:-0.2px}
.head span{font-size:9px;color:#7d84b0}
.sector-nav{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.sector-nav button{width:32px;height:32px;border-radius:10px;background:#ffffff10;border:1px solid #ffffff1a;font-size:14px;display:grid;place-items:center;transition:transform .1s}
.sector-nav button:active{transform:scale(.92)}
.sector-nav button:disabled{opacity:.3;cursor:not-allowed}
.sector-nav .sname{flex:1;text-align:center;font-size:12px;font-weight:800}
.sector-nav .sname small{display:block;color:#7d84b0;font-size:9px;font-weight:600;margin-top:2px}
.asteroids{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ast{padding:8px 3px;min-height:100px;border-radius:14px;background:linear-gradient(180deg,#ffffff08,#ffffff03);border:1px solid #ffffff0d;transition:all .2s;position:relative;overflow:hidden}
.ast::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%, #8b72ff22, transparent 70%);opacity:0;transition:opacity .2s}
.ast.selected{border-color:#8b72ff88;background:linear-gradient(180deg,#8b72ff22,#8b72ff08);box-shadow:0 0 20px #8b72ff44, inset 0 1px 0 #ffffff20}
.ast.selected::before{opacity:1}
.ast.selected .rock{transform:scale(1.15)}
.ast.locked{opacity:0.35;filter:grayscale(0.8)}
.ast.disabled{cursor:not-allowed}
.rock{display:block;font-size:24px;position:relative;transition:transform .2s}
.ast b{font-size:8.5px;display:block;margin-top:2px;font-weight:700;line-height:1.1}
.ast small{font-size:7.5px;color:#7d84b0;line-height:1.3;display:block;margin-top:2px}
.ast small .nrg{color:#54d9ff;font-weight:700}
.ast small .xp{color:#ffd966;font-weight:700}
.ast:active{transform:scale(.96)}
.loot{display:flex;justify-content:space-between;color:#7d84b0;font-size:10px;margin-top:10px}
.loot b{color:#fff;font-weight:700}
.loot .rich{color:#57e5ad}
.loot .danger{color:#ff7b7b}
.action{width:100%;min-height:50px;margin-top:11px;border-radius:16px;background:linear-gradient(135deg,#6c63ef,#9c50e7);font-weight:900;font-size:14px;letter-spacing:0.3px;box-shadow:0 10px 30px #765bf066, inset 0 1px 0 #ffffff33;transition:transform .12s;position:relative;overflow:hidden}
.action::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff33,transparent);transform:translateX(-100%);animation:shine 3s infinite}
@keyframes shine{0%{transform:translateX(-100%)}50%,100%{transform:translateX(100%)}}
.action:active{transform:scale(.97)}
.action:disabled{opacity:.5;cursor:not-allowed}
.action:disabled::after{display:none}
.progress{display:none;margin-top:10px}
.progress.show{display:block}
.prow{display:flex;justify-content:space-between;color:#7d84b0;font-size:10px;margin-bottom:6px}
.pbar{height:6px;background:#ffffff10;border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#54d9ff,#8b72ff);transition:width .25s linear;box-shadow:0 0 10px #8b72ffaa}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px 12px max(8px,env(safe-area-inset-bottom));background:linear-gradient(180deg,#0a0d2400,#0a0d24cc 20%,#0a0d24f5);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid #ffffff10;z-index:5}
.nav button{min-height:52px;border-radius:12px;font-size:9px;font-weight:700;color:#cbd0e5;background:transparent;transition:all .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;position:relative}
.nav button .ico{font-size:17px}
.nav button:active{transform:scale(.92);background:#ffffff10}
.nav button.locked{opacity:.4;color:#5a5f7a}
.nav button.locked::after{content:"🔒";position:absolute;top:4px;right:6px;font-size:10px}
.nav button.badge::after{content:"";position:absolute;top:6px;right:22%;width:7px;height:7px;border-radius:50%;background:#ff4b6e;box-shadow:0 0 8px #ff4b6eaa}
.modal{position:fixed;inset:0;z-index:10;background:#000000cc;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal.show{opacity:1;pointer-events:auto}
.modalcard{width:100%;max-width:520px;padding:22px 18px max(22px,env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:linear-gradient(180deg,#1a1d3a,#131630);border-top:1px solid #ffffff1a;max-height:88vh;overflow-y:auto;transform:translateY(30px);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.modal.show .modalcard{transform:translateY(0)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mh h2{font-size:18px;font-weight:900;letter-spacing:-0.3px}
.close{width:34px;height:34px;border-radius:11px;background:#ffffff10;border:1px solid #ffffff1a;font-size:20px;line-height:1;color:#cbd0e5;transition:all .15s}
.close:active{transform:scale(.9);background:#ffffff20}
.inv-cat{margin-top:14px}
.inv-cat-title{font-size:11px;font-weight:800;color:#7d84b0;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;padding-left:4px}
.sell-all-panel{padding:13px;border-radius:15px;background:linear-gradient(135deg,#ffd96625,#f5a62315);border:1px solid #ffd96655;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sell-all-panel .sa-info{flex:1;min-width:0}
.sell-all-panel .sa-label{font-size:10px;color:#7d84b0;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.sell-all-panel .sa-total{font-size:20px;font-weight:900;color:#ffd966;margin-top:3px}
.sell-all-panel .sa-count{font-size:9px;color:#7d84b0;margin-top:2px}
.sell-all-panel button{padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,#ffc93c,#f5a623);color:#1a0e00;font-size:11px;font-weight:900;white-space:nowrap;box-shadow:0 6px 16px #f5a62355;transition:transform .1s}
.sell-all-panel button:active{transform:scale(.94)}
.sell-all-panel button:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.inv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.inv-item{padding:12px;border-radius:14px;background:linear-gradient(180deg,#ffffff10,#ffffff05);border:1px solid #ffffff10}
.inv-item .row{display:flex;align-items:center;gap:9px}
.inv-item .emoji{font-size:24px;flex-shrink:0}
.inv-item .info{flex:1;min-width:0}
.inv-item .name{font-size:11px;font-weight:700;color:#cbd0e5}
.inv-item .amount{font-size:15px;font-weight:900;margin-top:2px}
.inv-item .price{font-size:9px;color:#7d84b0;margin-top:4px}
.inv-item .sell-btn{width:100%;margin-top:9px;padding:9px;border-radius:10px;background:linear-gradient(135deg,#57e5ad,#54d9ff);color:#051a1a;font-size:10px;font-weight:900;transition:transform .1s}
.inv-item .sell-btn:active{transform:scale(.96)}
.inv-item .sell-btn:disabled{opacity:.35;cursor:not-allowed}
.inv-item .sell-all{background:linear-gradient(135deg,#ffd966,#f5a623)}
.crystal-card{padding:13px;border-radius:15px;background:linear-gradient(180deg,#54d9ff20,#8b72ff10);border:1px solid #54d9ff55;margin-bottom:12px;box-shadow:0 0 24px #54d9ff20}
.crystal-card .cc-head{display:flex;align-items:center;gap:11px}
.crystal-card .cc-emoji{font-size:32px;flex-shrink:0}
.crystal-card .cc-info{flex:1}
.crystal-card .cc-name{font-size:11px;font-weight:700;color:#cbd0e5;text-transform:uppercase;letter-spacing:1px}
.crystal-card .cc-amount{font-size:20px;font-weight:900;color:#fff;margin-top:2px}
.crystal-card .cc-hint{font-size:9.5px;color:#7d84b0;margin-top:4px}
.crystal-card .cc-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.crystal-card .cc-btns button{padding:10px 6px;border-radius:11px;font-size:10px;font-weight:900;transition:transform .1s}
.crystal-card .cc-btns button:active{transform:scale(.96)}
.crystal-card .btn-sell{background:linear-gradient(135deg,#ffd966,#f5a623);color:#1a0e00}
.crystal-card .btn-add{background:linear-gradient(135deg,#57e5ad,#54d9ff);color:#051a1a}
.market-row{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-radius:13px;margin-top:7px;background:linear-gradient(180deg,#ffffff0a,#ffffff03);border:1px solid #ffffff0d}
.market-row .r-info{display:flex;align-items:center;gap:10px;flex:1}
.market-row .r-emoji{font-size:22px}
.market-row .r-name{font-size:12px;font-weight:700}
.market-row .r-amount{font-size:9px;color:#7d84b0;margin-top:2px}
.market-row .r-price{text-align:right}
.market-row .r-price b{font-size:14px;font-weight:900;display:block}
.market-row .r-change{font-size:9px;font-weight:800;margin-top:2px}
.market-row .r-change.up{color:#57e5ad}
.market-row .r-change.down{color:#ff6b6b}
.market-row .r-change.flat{color:#7d84b0}
.craft-card{padding:14px;border-radius:16px;margin-top:10px;background:linear-gradient(180deg,#ffffff10,#ffffff05);border:1px solid #ffffff0d}
.craft-card.available{border-color:#57e5ad55;background:linear-gradient(180deg,#57e5ad10,#57e5ad03);box-shadow:0 0 24px #57e5ad15}
.craft-card.current{border-color:#ffd96655;background:linear-gradient(180deg,#ffd96610,#ffd96603)}
.craft-card .ch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.craft-card .ch .name{font-size:15px;font-weight:900}
.craft-card .ch .tag{font-size:9px;font-weight:800;padding:3px 8px;border-radius:7px;background:#ffffff15;color:#7d84b0}
.craft-card.available .ch .tag{background:#57e5ad20;color:#57e5ad}
.craft-card.current .ch .tag{background:#ffd96620;color:#ffd966}
.craft-card .cdesc{font-size:10.5px;color:#7d84b0;margin-top:7px;line-height:1.5}
.craft-card .cost{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.craft-card .cost .citem{padding:5px 9px;border-radius:9px;font-size:10px;font-weight:800;background:#00000040;border:1px solid #ffffff10;display:flex;align-items:center;gap:4px}
.craft-card .cost .citem.ok{color:#57e5ad;border-color:#57e5ad33}
.craft-card .cost .citem.bad{color:#ff6b6b;border-color:#ff6b6b33}
.craft-card button{width:100%;margin-top:11px;padding:11px;border-radius:12px;background:linear-gradient(135deg,#54d9ff,#8b72ff);color:#051a1a;font-size:11px;font-weight:900;box-shadow:0 6px 16px #54d9ff55;transition:transform .1s}
.craft-card button:active{transform:scale(.97)}
.craft-card button:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}
.upgrade{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px;background:linear-gradient(180deg,#ffffff10,#ffffff05);border:1px solid #ffffff0d;border-radius:15px;margin-top:9px}
.upgrade .upinfo{flex:1;min-width:0}
.upgrade p{font-size:13px;font-weight:800}
.upgrade small{display:block;color:#7d84b0;font-size:9.5px;margin-top:3px;line-height:1.4}
.upgrade small .hl{color:#57e5ad;font-weight:700}
.upgrade button{padding:11px 13px;border-radius:12px;background:linear-gradient(135deg,#7564ee,#9c50e7);font-size:11px;font-weight:900;box-shadow:0 6px 16px #7564ee55;white-space:nowrap}
.upgrade button:active{transform:scale(.94)}
.upgrade button:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{padding:13px;border-radius:14px;background:linear-gradient(180deg,#ffffff10,#ffffff05);border:1px solid #ffffff10}
.stat small{display:block;color:#7d84b0;font-size:9px;margin-bottom:3px}
.stat b{font-size:19px;font-weight:900}
.shopitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px;border-radius:15px;margin-top:9px;background:linear-gradient(180deg,#ffffff10,#ffffff05);border:1px solid #ffffff0d}
.shopitem .info{flex:1;min-width:0}
.shopitem p{font-size:13px;font-weight:800}
.shopitem small{display:block;color:#7d84b0;font-size:9.5px;margin-top:3px;line-height:1.4}
.shopitem button{padding:11px 14px;border-radius:12px;background:linear-gradient(135deg,#ffc93c,#f5a623);color:#1a0e00;font-size:11px;font-weight:900;box-shadow:0 6px 16px #f5a62355;white-space:nowrap}
.shopitem button:active{transform:scale(.94)}
.boost-card{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px;border-radius:15px;margin-top:9px;background:linear-gradient(135deg,#ff7bd520,#8b72ff10);border:1px solid #ff7bd540}
.boost-card.active{background:linear-gradient(135deg,#ff7bd540,#8b72ff20);box-shadow:0 0 24px #ff7bd540}
.boost-card .boost-info{flex:1;min-width:0}
.boost-card p{font-size:13px;font-weight:800;color:#ffb8e8}
.boost-card small{display:block;color:#7d84b0;font-size:9.5px;margin-top:3px;line-height:1.4}
.boost-card button{padding:11px 13px;border-radius:12px;background:linear-gradient(135deg,#ff7bd5,#8b72ff);font-size:11px;font-weight:900;white-space:nowrap;box-shadow:0 6px 16px #ff7bd555}
.boost-card button:disabled{opacity:.4;box-shadow:none}
.achievement{display:flex;align-items:center;gap:11px;padding:12px;border-radius:14px;margin-top:8px;background:linear-gradient(180deg,#ffffff0a,#ffffff03);border:1px solid #ffffff0d}
.achievement.done{border-color:#57e5ad55;background:linear-gradient(180deg,#57e5ad10,#57e5ad03)}
.achievement .ach-emoji{font-size:26px;flex-shrink:0;width:32px;text-align:center}
.achievement .ach-info{flex:1;min-width:0}

function allAsteroids(){
  var arr = [];
  for (var i = 0; i < SECTORS.length; i++) for (var j = 0; j < SECTORS[i].asteroids.length; j++) arr.push(SECTORS[i].asteroids[j]);

function findAsteroid(id){
  var all = allAsteroids();
  for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
  return null;
}

// Крупные числа: 1500 → 1.5K, 1200000 → 1.2M
function fmtBig(n){
  n = Math.floor(Number(n) || 0);
  if (Math.abs(n) < 10000) return n.toLocaleString('ru-RU');
  if (Math.abs(n) < 1000000) return (n/1000).toFixed(1).replace(/\.0$/, '') + 'K';
  if (Math.abs(n) < 1000000000) return (n/1000000).toFixed(2).replace(/\.?0+$/, '') + 'M';
  return (n/1000000000).toFixed(2).replace(/\.?0+$/, '') + 'B';
}

  function requiredLevel(key){
    var u = null;
    for (var i = 0; i < UNLOCKS.length; i++) if (UNLOCKS[i].key === key) u = UNLOCKS[i];
    return u ? u.level : 1;
  }
  function checkNewUnlocks(prevLevel){
    var s = State.get();
    var newOnes = [];
    for (var i = 0; i < UNLOCKS.length; i++) {
      var u = UNLOCKS[i];
      if (s.level >= u.level && prevLevel < u.level && s.unlocks.indexOf(u.key) < 0) {
        s.unlocks.push(u.key);
        s.pendingUnlocks.push(u.key);
        newOnes.push(u);
      }
    }
    if (s.level === 1) {
      for (var j = 0; j < UNLOCKS.length; j++) {
        var u2 = UNLOCKS[j];
        if (u2.level === 1 && s.unlocks.indexOf(u2.key) < 0) {
          s.unlocks.push(u2.key);
        }
      }
    }
    if (newOnes.length) State.save();
    return newOnes;
  }
  function acknowledge(key){
    var s = State.get();
    var idx = s.pendingUnlocks.indexOf(key);
    if (idx >= 0) { s.pendingUnlocks.splice(idx, 1); State.save(); }
  }
  function hasPending(){
    var s = State.get();
    return s.pendingUnlocks.length > 0;
  }
  return { isUnlocked: isUnlocked, requiredLevel: requiredLevel, checkNewUnlocks: checkNewUnlocks, acknowledge: acknowledge, hasPending: hasPending };
})();

/* ============ MARKET ============ */
var Market = (function(){
  function update(){
    var s = State.get();
    var now = Date.now();
    if (now - s.market.updatedAt < CONFIG.MARKET_UPDATE_MS) return false;
    s.market.prev = {};
    for (var k in s.market.prices) s.market.prev[k] = s.market.prices[k];
    for (var k2 in RESOURCES) {
      var base = RESOURCES[k2].basePrice;
      var cur = s.market.prices[k2] || base;
      var drift = (base - cur) * 0.3;
      var noise = (Math.random() - 0.5) * 2 * base * CONFIG.MARKET_FLUCTUATION;
      var next = cur + drift + noise;
      next = Math.max(base * 0.6, Math.min(base * 1.4, next));
      s.market.prices[k2] = Math.round(next * 10) / 10;
    }
    s.market.updatedAt = now;
    State.save();
    return true;
  }
  function getMarketBonus(){
    var s = State.get();
    var maxVal = 0;
    for (var i = 0; i < RESEARCH_TREE.length; i++) {
      var r = RESEARCH_TREE[i];
      if (r.effect_key === 'market' && s.research.indexOf(r.id) >= 0) maxVal = Math.max(maxVal, r.value);
    }
    return maxVal;
  }
  function priceOf(key){
    var s = State.get();
    var p = s.market.prices[key] || RESOURCES[key].basePrice;
    if (s.event && s.event.effect && s.event.effect.marketMult && s.event.expiresAt > Date.now()) p *= s.event.effect.marketMult;
    p *= (1 + getMarketBonus());
    return p;
  }
  function change(key){
    var s = State.get();
    var cur = s.market.prices[key] || RESOURCES[key].basePrice;
    var prev = s.market.prev[key] || RESOURCES[key].basePrice;
    if (prev === 0) return 0;
    return ((cur - prev) / prev) * 100;
  }
  function sell(key, amount){
    var s = State.get();
    var have = s.inventory[key] || 0;
    var qty = Math.min(have, Math.floor(amount));
    if (qty <= 0) return { ok:false };
    var price = priceOf(key);
    var revenue = Math.floor(qty * price);
    s.inventory[key] -= qty;
    s.credits += revenue;
    s.stats.sold++;
    s.stats.totalEarned += revenue;
    State.save();
    return { ok:true, revenue: revenue, qty: qty, price: price };
  }
  // Продать всё сразу (все ресурсы)
  function sellEverything(){
    var s = State.get();
    var keys = Object.keys(RESOURCES);
    var totalRevenue = 0, totalItems = 0, brokenDown = [];
    for (var i = 0; i < keys.length; i++) {
      var key = keys[i];
      var have = s.inventory[key] || 0;
      if (have <= 0) continue;
      var price = priceOf(key);
      var revenue = Math.floor(have * price);
      s.inventory[key] = 0;
      s.credits += revenue;
      totalRevenue += revenue;
      totalItems += have;
      brokenDown.push({ key: key, qty: have, revenue: revenue });
    }
    if (totalItems <= 0) return { ok:false };
    s.stats.sold++;
    s.stats.totalEarned += totalRevenue;
    State.save();
    return { ok:true, revenue: totalRevenue, items: totalItems, broken: brokenDown };
  }
  function convertCrystals(amount){
    var s = State.get();
    var have = s.inventory.crystal || 0;
    var qty = Math.min(have, Math.floor(amount));
    if (qty <= 0) return { ok:false };
    var premium = Math.floor(qty * CONFIG.CRYSTAL_TO_PREMIUM);
    s.inventory.crystal -= qty;
    s.crystals += premium;
    s.stats.crystalsAdded += premium;
    State.save();
    return { ok:true, premium: premium, qty: qty };
  }
  return { update: update, priceOf: priceOf, change: change, sell: sell, sellEverything: sellEverything, convertCrystals: convertCrystals };
})();

/* ============ EVENTS ============ */
var Events = (function(){
  function trySpawn(){
    var s = State.get();
    var now = Date.now();
    if (s.event && s.event.expiresAt > now) return null;
    if (s.event && s.event.expiresAt <= now) { s.event = null; State.save(); }
    if (now < s.nextEventAt) return null;
    var ev = EVENTS[Math.floor(Math.random() * EVENTS.length)];
    if (ev.instant) {
      var rewards = { iron: 200 + s.level * 50, titan: 50 + s.level * 15, crystal: 5 + Math.floor(s.level/2) };
      var parts = [];
      if (rewards.iron) { s.inventory.iron += rewards.iron; s.stats.iron += rewards.iron; parts.push('🔩+' + rewards.iron); }
      if (rewards.titan) { s.inventory.titan += rewards.titan; s.stats.titan += rewards.titan; parts.push('🪨+' + rewards.titan); }
      if (rewards.crystal) { s.inventory.crystal += rewards.crystal; s.stats.crystal += rewards.crystal; parts.push('💠+' + rewards.crystal); }
      s.stats.events++;
      s.nextEventAt = now + (CONFIG.EVENT_MIN_INTERVAL + Math.random() * (CONFIG.EVENT_MAX_INTERVAL - CONFIG.EVENT_MIN_INTERVAL));
      State.save();
      return { instant:true, msg: '☄️ Метеоритный дождь: ' + parts.join(' • ') };
    } else {
      s.event = { id: ev.id, name: ev.name, desc: ev.desc, effect: ev.effect, expiresAt: now + ev.dur };
      s.stats.events++;
      s.nextEventAt = now + ev.dur + CONFIG.EVENT_MIN_INTERVAL + Math.random() * (CONFIG.EVENT_MAX_INTERVAL - CONFIG.EVENT_MIN_INTERVAL);
      State.save();
      return { event: s.event };
    }
  }
  function active(){
    var s = State.get();
    if (s.event && s.event.expiresAt > Date.now()) return s.event;
    return null;
  }
  function tick(){
    var s = State.get();
    if (s.event && s.event.expiresAt <= Date.now()) { s.event = null; State.save(); return true; }
    return false;
  }
  return { trySpawn: trySpawn, active: active, tick: tick };
})();

/* ============ ECONOMY ============ */
var Economy = (function(){
  function isBoosting(){
    var s = State.get();
    return s.boost && s.boost.expiresAt > Date.now();
  }
  function getActiveShip(){
    var s = State.get();
    for (var i = 0; i < SHIPS.length; i++) if (SHIPS[i].id === s.activeShip) return SHIPS[i];
    return SHIPS[0];
  }
  function getModuleBonus(key){
    var s = State.get();
    var total = 0;
    for (var i = 0; i < MODULES.length; i++) {
      var lvl = s.modules[MODULES[i].id] || 0;
      if (lvl <= 0) continue;
      var eff = MODULES[i].effect(lvl);
      if (eff[key]) total += eff[key];
    }
    return total;
  }
  // Возвращает макс. значение для ключа (замена, не сумма)
  function getResearchBonus(key){
    var s = State.get();
    var value = 0;
    for (var i = 0; i < RESEARCH_TREE.length; i++) {
      var r = RESEARCH_TREE[i];
      if (r.effect_key === key && s.research.indexOf(r.id) >= 0) value = Math.max(value, r.value);
    }
    return value;
  }
  function getEffectiveStats(){
    var s = State.get();
    var ship = getActiveShip();
    var stats = {
      drill: 10 + ship.bonuses.drill + s.upgrades.drill * CONFIG.DRILL_STEP,
      cargo: 100 + ship.bonuses.cargo + s.upgrades.cargo * CONFIG.CARGO_STEP,
      energyMax: 100 + ship.bonuses.energy + s.upgrades.energy * CONFIG.ENERGY_STEP
    };
    stats.cargo += getModuleBonus('cargoBonus');
    stats.energyMax += getModuleBonus('energyBonus');
    stats.energyMax += Math.floor(stats.energyMax * getResearchBonus('energy_max'));
    return stats;
  }
  function getYieldMult(){
    var s = State.get();
    var mult = 1 + getResearchBonus('all_yield');
    mult *= (1 + getModuleBonus('yieldBonus'));
    var ev = Events.active();
    if (ev && ev.effect && ev.effect.yieldMult) mult *= ev.effect.yieldMult;
    if (isBoosting()) mult *= s.activeBoostMult;
    return mult;
  }
  function getSpeedMult(){
    var s = State.get();
    return Math.max(0.2, 1 - getModuleBonus('timeReduction'));
  }
  function getXpMult(){
    var s = State.get();
    var mult = 1 + getResearchBonus('xp_bonus');
    var ev = Events.active();
    if (ev && ev.effect && ev.effect.xpMult) mult *= ev.effect.xpMult;
    return mult;
  }
  function applyEnergyRegen(){
    var s = State.get();
    var elapsed = (Date.now() - (s.lastSeen || Date.now())) / 1000;
    if (elapsed < 1) return;
    var stats = getEffectiveStats();
    if (typeof s.energyStored !== 'number') s.energyStored = stats.energyMax;
    if (s.energyStored >= stats.energyMax) return;
    var regen = elapsed * CONFIG.ENERGY_REGEN_PER_SEC;
    regen *= (1 + getResearchBonus('regen'));
    s.energyStored = Math.min(stats.energyMax, s.energyStored + regen);
  }
  function getEnergy(){
    var s = State.get();
    var stats = getEffectiveStats();
    if (typeof s.energyStored !== 'number') s.energyStored = stats.energyMax;
    return Math.min(s.energyStored, stats.energyMax);
  }
  function setEnergy(v){ State.get().energyStored = Math.max(0, v); }
  function calcMining(a){
    var stats = getEffectiveStats();
    var timeFactor = 1 - stats.drill / (stats.drill + 80);
    var duration = Math.max(1.5, Math.round(a.dur * timeFactor * getSpeedMult() * 10) / 10);
    var energyCost = Math.ceil(duration * CONFIG.ENERGY_COST_MULT);
    energyCost = Math.ceil(energyCost * (1 - getResearchBonus('energy_save')));
    return { duration: duration, energyCost: energyCost };
  }
  function rollWithChance(min, max, chance){
    if (Math.random() > chance) return 0;
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }
  function calcReward(a){
    var s = State.get();
    var stats = getEffectiveStats();
    var totalVolume = 0;
    for (var k in RESOURCES) if (a[k]) totalVolume += a[k][1];
    var factor = Math.min(1, stats.cargo / Math.max(1, totalVolume));
    function roll(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
    var yieldMult = getYieldMult();
    var rareBonus = 1 + getModuleBonus('rareBonus') + getResearchBonus('luck');
    var out = {};
    for (var key in RESOURCES) {
      if (!a[key]) { out[key] = 0; continue; }
      if (key === 'crystal') out[key] = rollWithChance(a[key][0], a[key][1], Math.min(1, (a.crystalChance || 0) * rareBonus));
      else if (key === 'iron') out[key] = Math.max(1, Math.floor(roll(a[key][0], a[key][1]) * factor * yieldMult));
      else out[key] = Math.floor(roll(a[key][0], a[key][1]) * factor * yieldMult);
    }
    return out;
  }
  function startMining(){
    var s = State.get();
    if (s.mining) return { ok:false, reason:'already_mining' };
    var sector = null;
    for (var i = 0; i < SECTORS.length; i++) if (SECTORS[i].id === s.sector) sector = SECTORS[i];
    if (!sector) return { ok:false, reason:'no_sector' };
    var a = sector.asteroids[s.selected];
    if (!a) return { ok:false, reason:'no_asteroid' };
    if (s.level < a.minLevel) return { ok:false, reason:'locked' };
    var cm = calcMining(a);
    var energy = getEnergy();
    if (energy < cm.energyCost) return { ok:false, reason:'no_energy', need: cm.energyCost };
    setEnergy(energy - cm.energyCost);
    s.stats.energySpent += cm.energyCost;
    s.mining = { started: Date.now(), duration: cm.duration, asteroidId: a.id, energySpent: cm.energyCost };
    State.save();
    return { ok:true, duration: cm.duration, energyCost: cm.energyCost };
  }
  function claimMining(){
    var s = State.get();
    if (!s.mining) return { ok:false, reason:'not_mining' };
    var elapsed = (Date.now() - s.mining.started) / 1000;
    if (elapsed < s.mining.duration) return { ok:false, reason:'too_early' };
    var a = findAsteroid(s.mining.asteroidId);
    if (!a) { s.mining = null; return { ok:false, reason:'no_asteroid' }; }
    var reward = calcReward(a);
    var xpGain = Math.floor(a.xp * getXpMult());
    var prevLevel = s.level;
    for (var key in RESOURCES) {
      var rk = reward[key] || 0;
      s.inventory[key] += rk;
      s.stats[key] += rk;
    }
    s.xp += xpGain;
    var leveledUp = false, levelsGained = 0;
    while (s.xp >= xpToNext(s.level)) {
      s.xp -= xpToNext(s.level);
      s.level++;
      levelsGained++;
      leveledUp = true;
    }
    if (s.xp < 0) s.xp = 0; // защита
    if (leveledUp) {
      s.researchPoints += levelsGained;
      var stats = getEffectiveStats();
      setEnergy(stats.energyMax);
    }
    s.stats.mines++;
    s.mining = null;
    State.save();
    var newUnlocks = leveledUp ? Unlocks.checkNewUnlocks(prevLevel) : [];
    return { ok:true, reward: reward, xpGain: xpGain, leveledUp: leveledUp, levelsGained: levelsGained, newLevel: s.level, newUnlocks: newUnlocks };
  }
  function applyOfflineIncome(){
    var s = State.get();
    var elapsed = (Date.now() - (s.lastSeen || Date.now())) / 1000;
    if (elapsed < 120) return null; // меньше 2 минут — не считаем
    var hours = Math.min(elapsed / 3600, CONFIG.OFFLINE_MAX_HOURS);
    // Скорость: 5 кредитов/час × уровень × бонус от корабля
    var rate = CONFIG.OFFLINE_RATE_PER_LEVEL * s.level * (1 + s.level * 0.15);
    var earned = Math.floor(rate * hours);
    if (earned <= 0) return null;
    s.credits += earned;
    s.stats.totalEarned += earned;
    State.save();
    return { credits: earned, hours: hours.toFixed(1) };
  }
  function getUpgradePrices(){
    var s = State.get();
    return {
      drill: Math.floor(250 * Math.pow(1.5, s.upgrades.drill)),
      cargo: Math.floor(300 * Math.pow(1.5, s.upgrades.cargo)),
      energy: Math.floor(220 * Math.pow(1.5, s.upgrades.energy))
    };
  }
  function buyUpgrade(key){
    var s = State.get();
    var price = getUpgradePrices()[key];
    if (!price) return { ok:false };
    if (s.credits < price) return { ok:false, reason:'no_credits', need: price };
    var maxLvl = Math.floor(CONFIG.DRILL_MAX / CONFIG.DRILL_STEP);
    if (key === 'drill' && s.upgrades.drill >= maxLvl) return { ok:false, reason:'max' };
    s.credits = Math.max(0, s.credits - price);
    s.upgrades[key]++;
    State.save();
    return { ok:true, price: price };
  }
  function buyShip(shipId){
    var s = State.get();
    var ship = null;
    for (var i = 0; i < SHIPS.length; i++) if (SHIPS[i].id === shipId) ship = SHIPS[i];
    if (!ship) return { ok:false };
    if (s.ships.indexOf(shipId) >= 0) return { ok:false, reason:'owned' };
    if (s.level < ship.minLevel) return { ok:false, reason:'level', need: ship.minLevel };
    var c = ship.cost;
    if (s.credits < c.credits) return { ok:false, reason:'credits' };
    if (s.inventory.iron < c.iron) return { ok:false, reason:'iron' };
    if (s.inventory.titan < (c.titan||0)) return { ok:false, reason:'titan' };
    if (s.inventory.crystal < (c.crystal||0)) return { ok:false, reason:'crystal' };
    if (s.inventory.plasma < (c.plasma||0)) return { ok:false, reason:'plasma' };
    if (s.inventory.dark < (c.dark||0)) return { ok:false, reason:'dark' };
    s.credits = Math.max(0, s.credits - c.credits);
    s.inventory.iron -= c.iron;
    s.inventory.titan -= (c.titan||0);
    s.inventory.crystal -= (c.crystal||0);
    s.inventory.plasma -= (c.plasma||0);
    s.inventory.dark -= (c.dark||0);
    s.ships.push(shipId);

    State.save();

  function selectShip(shipId){

    return { ok:true };

  function getModuleCost(modId){

    if (!m) return null;

    return {
      credits: Math.floor(m.baseCost.credits * mult),
      iron: Math.floor(m.baseCost.iron * mult),
      titan: Math.floor((m.baseCost.titan||0) * mult),
      crystal: Math.floor((m.baseCost.crystal||0) * mult)
    };
  }
  function buyModule(modId){
    var s = State.get();
    var m = null;
    for (var i = 0; i < MODULES.length; i++) if (MODULES[i].id === modId) m = MODULES[i];
    if (!m) return { ok:false };
    var curLvl = s.modules[modId] || 0;
    if (curLvl >= m.maxLevel) return { ok:false, reason:'max' };
    var cost = getModuleCost(modId);
    if (s.credits < cost.credits) return { ok:false, reason:'credits' };
    if (s.inventory.iron < cost.iron) return { ok:false, reason:'iron' };
    if (s.inventory.titan < cost.titan) return { ok:false, reason:'titan' };
    if (s.inventory.crystal < cost.crystal) return { ok:false, reason:'crystal' };
    s.credits = Math.max(0, s.credits - cost.credits);
    s.inventory.iron -= cost.iron;
    s.inventory.titan -= cost.titan;
    s.inventory.crystal -= cost.crystal;
    s.modules[modId] = curLvl + 1;
    State.save();
    return { ok:true, level: curLvl + 1 };
  }
  function canResearch(researchId){
    var s = State.get();
    var r = null;
    for (var i = 0; i < RESEARCH_TREE.length; i++) if (RESEARCH_TREE[i].id === researchId) r = RESEARCH_TREE[i];
    if (!r) return { ok:false };
    if (s.research.indexOf(researchId) >= 0) return { ok:false, reason:'done' };
    if (r.req && s.research.indexOf(r.req) < 0) return { ok:false, reason:'needs_prev', need: r.req };
    if (s.researchPoints < r.cost) return { ok:false, reason:'no_points', need: r.cost };
    return { ok:true, research: r };
  }
  function buyResearch(researchId){
    var s = State.get();
    var check = canResearch(researchId);
    if (!check.ok) return check;
    s.researchPoints -= check.research.cost;
    s.research.push(researchId);
    State.save();
    return { ok:true };
  }
  function buyBoost(boostId){
    var s = State.get();
    var b = null;
    for (var i = 0; i < BOOSTS.length; i++) if (BOOSTS[i].id === boostId) b = BOOSTS[i];
    if (!b) return { ok:false };
    if (s.crystals < b.price) return { ok:false, reason:'no_crystals', need: b.price };
    if (isBoosting()) return { ok:false, reason:'already_active' };
    s.crystals -= b.price;
    s.activeBoostMult = boostId === 'boost_x3' ? 3 : 2;
    s.boost = { expiresAt: Date.now() + (boostId === 'boost_x3' ? 3*60*1000 : CONFIG.BOOST_DURATION) };
    State.save();
    return { ok:true };
  }
  function refine(from, to, amount){
    var s = State.get();
    var recipes = { 'iron->titan':10, 'titan->crystal':10, 'crystal->plasma':5, 'plasma->dark':5, 'dark->anti':5 };
    var rate = recipes[from + '->' + to];
    if (!rate) return { ok:false };
    if (s.inventory[from] < rate * amount) return { ok:false };
    s.inventory[from] -= rate * amount;
    s.inventory[to] += amount;
    s.stats.refined += amount;
    State.save();
    return { ok:true };
  }
  function ruleta(){
    var s = State.get();
    if (s.crystals < 20) return { ok:false, reason:'no_crystals', need: 20 };
    s.crystals -= 20;
    s.stats.ruleta++;
    var roll = Math.random();
    var prize;
    if (roll < 0.35) {
      var amt = 200 + Math.floor(Math.random() * 300);
      s.credits += amt; s.stats.totalEarned += amt;
      prize = { text: '💰 ' + amt + ' кредитов' };
    } else if (roll < 0.60) {
      var keys = ['iron','titan','crystal','plasma','dark'];
      var r = keys[Math.floor(Math.random()*keys.length)];
      var amounts = { iron:500, titan:100, crystal:20, plasma:8, dark:2 };
      s.inventory[r] += amounts[r];
      prize = { text: RESOURCES[r].emoji + ' ' + amounts[r] + ' ' + RESOURCES[r].name };
    } else if (roll < 0.80) {
      var amtC = 30 + Math.floor(Math.random() * 50);
      s.crystals += amtC;
      prize = { text: '💎 ' + amtC + ' кристаллов' };
    } else if (roll < 0.95) {
      s.researchPoints += 2;
      prize = { text: '🔬 +2 очка исследований' };
    } else {
      s.boost = { expiresAt: Date.now() + 5*60*1000 };
      s.activeBoostMult = 3;
      prize = { text: '🚀 МЕГА-БУСТ x3!' };
    }
    State.save();
    return { ok:true, prize: prize };
  }
  function getRank(){
    var s = State.get();
    var rank = RANKS[0];
    for (var i = 0; i < RANKS.length; i++) if (s.level >= RANKS[i].min) rank = RANKS[i];
    return rank;
  }
  function getCurrentSector(){
    var s = State.get();
    for (var i = 0; i < SECTORS.length; i++) if (SECTORS[i].id === s.sector) return SECTORS[i];
    return SECTORS[0];
  }
  function getCurrentAsteroids(){ return getCurrentSector().asteroids; }
  return {
    isBoosting: isBoosting, getActiveShip: getActiveShip,
    getEffectiveStats: getEffectiveStats, getModuleBonus: getModuleBonus,
    getResearchBonus: getResearchBonus,
    getYieldMult: getYieldMult, getSpeedMult: getSpeedMult, getXpMult: getXpMult,
    applyEnergyRegen: applyEnergyRegen, applyOfflineIncome: applyOfflineIncome,
    getEnergy: getEnergy, setEnergy: setEnergy,
    calcMining: calcMining, startMining: startMining, claimMining: claimMining,
    getUpgradePrices: getUpgradePrices, buyUpgrade: buyUpgrade,
    buyShip: buyShip, selectShip: selectShip,
    getModuleCost: getModuleCost, buyModule: buyModule,
    canResearch: canResearch, buyResearch: buyResearch,
    buyBoost: buyBoost, refine: refine, ruleta: ruleta,
    getRank: getRank, getCurrentSector: getCurrentSector, getCurrentAsteroids: getCurrentAsteroids
  };
})();

var Quests = (function(){
  var POOL = [
    { id:'q_mines', text:'Совершить {n} экспедиций', reward:{credits:300}, gen:function(s){return {target:5+s.level*2, stat:'mines', start:s.stats.mines};} },
    { id:'q_iron', text:'Добыть {n} железа', reward:{credits:400}, gen:function(s){return {target:50+s.level*25, stat:'iron', start:s.stats.iron};} },
    { id:'q_titan', text:'Добыть {n} титана', reward:{credits:800}, gen:function(s){return {target:20+s.level*8, stat:'titan', start:s.stats.titan};} },
    { id:'q_sell', text:'Продать {n} раз', reward:{credits:500}, gen:function(s){return {target:5+s.level, stat:'sold', start:s.stats.sold};} }
  ];
  function generate(){
    var s = State.get();
    var now = Date.now();
    if (s.quests.current.length > 0 && now < s.quests.refreshAt) return;
    var q = POOL[Math.floor(Math.random()*POOL.length)];
    var gen = q.gen(s);
    s.quests.current = [{ id: q.id, text: q.text.replace('{n}', gen.target), reward: q.reward, stat: gen.stat, start: gen.start, target: gen.target, done: false }];
    s.quests.refreshAt = now + CONFIG.QUEST_REFRESH_MS;
    State.save();
  }
  function progress(){
    var s = State.get();
    return s.quests.current.map(function(q){
      var cur = s.stats[q.stat] - q.start;
      return { id: q.id, text: q.text, reward: q.reward, cur: Math.max(0, cur), target: q.target, pct: Math.min(100, (cur/q.target)*100), complete: cur >= q.target, done: q.done };
    });
  }
  function claim(id){
    var s = State.get();
    var q = null;
    for (var i = 0; i < s.quests.current.length; i++) if (s.quests.current[i].id === id) q = s.quests.current[i];
    if (!q || q.done) return { ok:false };
    if (s.stats[q.stat] - q.start < q.target) return { ok:false };
    q.done = true;
    if (q.reward.credits) { s.credits += q.reward.credits; s.stats.totalEarned += q.reward.credits; }
    if (q.reward.crystals) s.crystals += q.reward.crystals;
    State.save();
    return { ok:true };
  }
  return { generate: generate, progress: progress, claim: claim };
})();

var Contracts = (function(){
  function generate(){
    var s = State.get();
    var now = Date.now();
    if (s.contracts.list.length > 0 && now < s.contracts.refreshAt) return;
    var list = [];
    var resources = ['iron', 'titan', 'crystal'];
    for (var i = 0; i < 3; i++) {
      var r = resources[Math.floor(Math.random() * resources.length)];
      var amount = 50 + Math.floor(Math.random() * 200) + s.level * 20;
      list.push({
        id: 'c_' + i + '_' + now, resource: r, amount: amount,
        reward: { credits: amount * 3, crystals: 2 + i, researchPoints: i === 2 ? 1 : 0 },
        done: false
      });
    }
    s.contracts.list = list;
    s.contracts.refreshAt = now + CONFIG.CONTRACT_REFRESH_MS;
    State.save();
  }
  function progress(){
    var s = State.get();
    return s.contracts.list.map(function(c){
      var have = s.inventory[c.resource] || 0;
      return { id: c.id, resource: c.resource, amount: c.amount, reward: c.reward, have: have, pct: Math.min(100, (have/c.amount)*100), complete: have >= c.amount, done: c.done };
    });
  }
  function claim(id){
    var s = State.get();
    var c = null;
    for (var i = 0; i < s.contracts.list.length; i++) if (s.contracts.list[i].id === id) c = s.contracts.list[i];
    if (!c || c.done) return { ok:false };
    if ((s.inventory[c.resource]||0) < c.amount) return { ok:false };
    s.inventory[c.resource] -= c.amount;
    if (c.reward.credits) { s.credits += c.reward.credits; s.stats.totalEarned += c.reward.credits; }
    if (c.reward.crystals) s.crystals += c.reward.crystals;
    if (c.reward.researchPoints) s.researchPoints += c.reward.researchPoints;
    c.done = true;
    State.save();
    return { ok:true };
  }
  return { generate: generate, progress: progress, claim: claim };
})();

    { id:'dark', emoji:'🌌', name:'Тёмная материя', desc:'Добыть тёмную материю', cond:function(s){return s.stats.dark>=1;}, reward:{crystals:100, researchPoints:2} },

  ];
  function check(){
    var s = State.get();
    var unlocked = [];
    for (var i = 0; i < LIST.length; i++) {
      var a = LIST[i];
      if (s.achievements.indexOf(a.id) >= 0) continue;
      var ok = false;
      try { ok = a.cond(s); } catch (e) {}
      if (ok) {
        s.achievements.push(a.id);
        if (a.reward.credits) { s.credits += a.reward.credits; s.stats.totalEarned += a.reward.credits; }
        if (a.reward.crystals) s.crystals += a.reward.crystals;
        if (a.reward.researchPoints) s.researchPoints += a.reward.researchPoints;
        unlocked.push(a);
      }
    }
    if (unlocked.length) State.save();
    return unlocked;
  }
  return { check: check, LIST: LIST };

var Daily = (function(){

  ];

    var s = State.get();
    var r = nextReward();
    if (r.credits) { s.credits += r.credits; s.stats.totalEarned += r.credits; }

    if (r.researchPoints) s.researchPoints += r.researchPoints;
    s.daily.streak++;
    s.daily.lastClaimDate = State.today();
    State.save();
    return { ok:true, reward: r };
  }
  return { canClaim: canClaim, nextReward: nextReward, claim: claim, REWARDS: REWARDS };
})();

var App = (function(){
  function $(id){ return document.getElementById(id); }
  var tg = null;
  try { tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null; } catch (e) {}
  var timer = null, unlockQueue = [];
  function haptic(type){
    try { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(type || 'light'); } catch (e) {}
  }
  function safe(fn){
    return function(){
      try { return fn.apply(this, arguments); } catch (e) {
        console.error('Error:', e);
        UI.toast('Ошибка: ' + (e.message || 'unknown'));
      }
    };
  }
  function showUnlockQueue(){
    if (unlockQueue.length === 0) return;
    var u = unlockQueue.shift();
    UI.unlockPopup(u);
  }
  function startMining(){
    var res = Economy.startMining();
    if (!res.ok) {
      if (res.reason === 'no_energy') UI.toast('⚡ Нужно ' + res.need + ' энергии');
      else if (res.reason === 'locked') UI.toast('🔒 Астероид недоступен');
      else if (res.reason === 'already_mining') UI.toast('⛏ Уже копаем');
      haptic('heavy');
      return;
    }
    haptic('medium');
    UI.renderShip(); UI.renderMining(); UI.renderAsteroids();
    Tutorial.update();
    startTimer();
  }
  function startTimer(){ stopTimer(); timer = setInterval(tick, 250); tick(); }
  function stopTimer(){ if (timer) { clearInterval(timer); timer = null; } }
  function tick(){
    var s = State.get();
    if (!s.mining) { stopTimer(); return; }
    var elapsed = (Date.now() - s.mining.started) / 1000;
    UI.updateProgress(elapsed, s.mining.duration);
    if (elapsed >= s.mining.duration) { stopTimer(); finishMining(); }
  }
  function finishMining(){
    var res = Economy.claimMining();
    if (!res.ok) { UI.renderMining(); return; }
    UI.renderWallet(); UI.renderXP(); UI.renderShip(); UI.renderMining(); UI.renderAsteroids(); UI.renderNavLocks();
    haptic('medium');
    var r = res.reward, parts = [];
    for (var key in RESOURCES) { var v = r[key]; if (v) parts.push(RESOURCES[key].emoji + '+' + fmtBig(v)); }
    UI.toast(parts.join(' ') + ' ✨+' + res.xpGain + 'xp');
    UI.floaty('+' + res.xpGain + ' XP', '#ffd966');
    if (res.leveledUp) {
      setTimeout(function(){
        UI.toast('🎉 Уровень ' + res.newLevel + '! +' + res.levelsGained + ' 🔬');
        UI.floaty('⚡ ЭНЕРГИЯ +100%', '#54d9ff');
      }, 500);
      if (res.newUnlocks && res.newUnlocks.length) {
        for (var i = 0; i < res.newUnlocks.length; i++) unlockQueue.push(res.newUnlocks[i]);
        setTimeout(showUnlockQueue, 1200);
      }
    }
    var newAch = Achievements.check();
    for (var j = 0; j < newAch.length; j++) {
      (function(a){ setTimeout(function(){ UI.toast('🏆 ' + a.name); }, 800 + j * 400); })(newAch[j]);
    }
    Quests.generate();
    Tutorial.update();
    if (newAch.length) UI.renderWallet();
  }
  /* ============ ИНВЕНТАРЬ ============ */
  function openInventory(){

    var html = '', totalValue = 0, totalItems = 0;
    // Считаем общую стоимость
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      var have = s.inventory[k] || 0;
      if (have <= 0) continue;
      totalValue += have * Market.priceOf(k);
      totalItems += have;
    }
    // Панель "Продать всё"
    if (totalItems > 0) {
      html += '<div class="sell-all-panel">' +
        '<div class="sa-info">' +

        '</div>' +
        '<button id="sellEverything">💰 ПРОДАТЬ ВСЁ</button>' +

      '</div>';
    }
    UI.modal('🎒 Инвентарь',
      '<div style="padding:12px;border-radius:14px;background:linear-gradient(90deg,#57e5ad22,#54d9ff22);border:1px solid #57e5ad44;text-align:center;margin-bottom:14px">' +

      var chgTxt = chg > 0.5 ? '<span class="up">▲+' + chg.toFixed(1) + '%</span>' : chg < -0.5 ? '<span class="down">▼' + chg.toFixed(1) + '%</span>' : '<span class="flat">—0%</span>';

  /* ============ ДРЕВО ИССЛЕДОВАНИЙ ============ */
  function openResearch(){
    if (!Unlocks.isUnlocked('research')) { UI.toast('🔒 Нужен уровень ' + Unlocks.requiredLevel('research')); return; }
    var s = State.get();
    var branches = ['mining', 'energy', 'market', 'science', 'luck'];
    var html = '<div class="tech-points-card">' +
      '<div class="tp-label">Очки исследований</div>' +
      '<div class="tp-value">🔬 ' + s.researchPoints + '</div>' +
      '<div class="tp-hint">1 очко за уровень • +2 за достижения-вехи<br>+1 за контракты • +2 за рулетку</div>' +
    '</div>';
    for (var b = 0; b < branches.length; b++) {
      var branch = branches[b];
      var nodes = [];
      for (var n = 0; n < RESEARCH_TREE.length; n++) {
        if (RESEARCH_TREE[n].branch === branch) nodes.push(RESEARCH_TREE[n]);
      }
      html += '<div class="tree-branch"><div class="tree-branch-title">' + getResearchBranchName(branch) + '</div><div class="tree-nodes">';
      for (var i = 0; i < nodes.length; i++) {
        var r = nodes[i];
        var done = s.research.indexOf(r.id) >= 0;
        var prevDone = !r.req || s.research.indexOf(r.req) >= 0;
        var canBuy = !done && prevDone && s.researchPoints >= r.cost;
        var cls = done ? 'done' : (canBuy ? 'available' : 'locked');
        var tag = done ? '✓ Изучено' : (canBuy ? 'Доступно' : ('🔬 ' + r.cost));
        var prevName = '';
        if (r.req) {
          for (var k = 0; k < RESEARCH_TREE.length; k++) if (RESEARCH_TREE[k].id === r.req) prevName = RESEARCH_TREE[k].name;
        }
        var btn = '';
        if (done) btn = '';
        else if (canBuy) btn = '<button data-r="' + r.id + '">Изучить за 🔬 ' + r.cost + '</button>';
        else if (!prevDone) btn = '<div class="needs">Требуется: ' + prevName + '</div><button disabled>Заблокировано</button>';
        else btn = '<button disabled>Мало очков (нужно 🔬 ' + r.cost + ')</button>';
        html += '<div class="tree-node ' + cls + '"><div class="tree-node-head"><div class="tn-name">' + r.name + '</div>' +
          '<div class="tn-tag">' + tag + '</div></div>' +
          '<div class="tree-node-desc">' + r.desc + '</div>' +
          (done ? '<div class="tree-node-effect">✓ Эффект активен</div>' : '') +
          btn + '</div>';
      }
      html += '</div></div>';
    }
    UI.modal('🔬 Древо исследований', html);
    var btns = document.querySelectorAll('[data-r]');
    for (i = 0; i < btns.length; i++) btns[i].onclick = function(){
      var r = Economy.buyResearch(this.getAttribute('data-r'));
      if (r.ok) { UI.toast('🔬 Изучено!'); UI.renderAll(); openResearch(); }
      else if (r.reason === 'needs_prev') UI.toast('🔒 Сначала изучите предыдущее');
      else if (r.reason === 'no_points') UI.toast('🔬 Нужно очков: ' + r.need);
    };
  }

          '<div class="ruleta-prize">💎 Кристаллы</div>' +
          '<div class="ruleta-prize">🔬 +2 Исследования</div>' +
          '<div class="ruleta-prize rare">🚀 МЕГА-БУСТ</div>' +
        '</div>' +
        '<div id="ruletaResult"></div>' +
        '<button id="spinBtn" class="ruleta-btn"' + (s.crystals<20?' disabled':'') + '>' + (s.crystals<20 ? '💎 Нужно 20' : '🎰 КРУТИТЬ') + '</button></div>'
    );
    var btn = document.getElementById('spinBtn');
    if (btn) btn.onclick = function(){
      var r = Economy.ruleta();
      if (!r.ok) return;
      document.getElementById('ruletaResult').innerHTML = '<div class="ruleta-result"><div class="big">🎉</div><div class="txt">' + r.prize.text + '</div></div>';
      UI.renderWallet(); UI.renderShip();
      var ob = document.getElementById('spinBtn');
      if (ob) ob.disabled = true;
      setTimeout(function(){ openRuleta(); }, 2500);
    };
  }
  /* ============ КОНТРАКТЫ ============ */
  function openContracts(){
    if (!Unlocks.isUnlocked('contracts')) { UI.toast('🔒 Нужен уровень ' + Unlocks.requiredLevel('contracts')); return; }
    Contracts.generate();
    var list = Contracts.progress();
    var html = '<p style="color:#7d84b0;font-size:10.5px;margin-bottom:10px;text-align:center">3 контракта в день</p>';
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      var res = RESOURCES[c.resource];
      html += '<div class="contract-card ' + (c.done?'done':'') + '"><div class="ctext">' + res.emoji + ' ' + UI.fmt(c.amount) + ' ' + res.name + '</div>' +
        '<div class="creward">Награда: 💰' + UI.fmt(c.reward.credits) + ' + 💎' + c.reward.crystals + (c.reward.researchPoints ? ' + 🔬' + c.reward.researchPoints : '') + '</div>' +
        '<div class="cbar"><i style="width:' + c.pct + '%"></i></div>' +
        '<small>' + UI.fmt(c.have) + ' / ' + UI.fmt(c.amount) + '</small>' +
        (c.complete && !c.done ? '<button data-c="' + c.id + '">🎁 Забрать</button>' : c.done ? '<small style="color:#57e5ad;margin-top:6px">✓</small>' : '') + '</div>';
    }
    UI.modal('📜 Контракты', html);
    var btns = document.querySelectorAll('[data-c]');
    for (i = 0; i < btns.length; i++) btns[i].onclick = function(){
      var r = Contracts.claim(this.getAttribute('data-c'));
      if (r.ok) { UI.toast('🎁 Награда'); UI.renderWallet(); openContracts(); }
    };
  }
  /* ============ КВЕСТЫ ============ */
  function openQuests(){
    if (!Unlocks.isUnlocked('quests')) { UI.toast('🔒 Нужен уровень ' + Unlocks.requiredLevel('quests')); return; }
    Quests.generate();
    var qs = Quests.progress();
    var html = '';
    for (var i = 0; i < qs.length; i++) {
      var q = qs[i];
      var rewardTxt = q.reward.credits ? '💰 ' + q.reward.credits : '💎 ' + q.reward.crystals;
      html += '<div class="quest ' + (q.complete?'done':'') + '"><div class="qhead"><p>' + q.text + '</p><div class="qreward">' + rewardTxt + '</div></div>' +
        '<div class="qbar"><i style="width:' + q.pct + '%"></i></div>' +
        '<small>' + q.cur + '/' + q.target + '</small>' +
        (q.complete && !q.done ? '<button data-claim="' + q.id + '">🎁 Забрать</button>' : q.done ? '<small style="color:#57e5ad;margin-top:6px">✓</small>' : '') + '</div>';
    }
    UI.modal('📋 Квесты', html);
    var btns = document.querySelectorAll('[data-claim]');
    for (i = 0; i < btns.length; i++) btns[i].onclick = function(){
      var r = Quests.claim(this.getAttribute('data-claim'));
      if (r.ok) { UI.toast('🎁 Награда'); UI.renderWallet(); openQuests(); }
    };
  }
  /* ============ ДОСТИЖЕНИЯ ============ */
  function openAchievements(){
    if (!Unlocks.isUnlocked('achievements')) { UI.toast('🔒 Нужен уровень ' + Unlocks.requiredLevel('achievements')); return; }
    var s = State.get();
    var html = '';
    for (var i = 0; i < Achievements.LIST.length; i++) {
      var a = Achievements.LIST[i];
      var done = s.achievements.indexOf(a.id) >= 0;
      var rewardTxt = '';
      if (a.reward.credits) rewardTxt += '💰' + a.reward.credits;
      if (a.reward.crystals) rewardTxt += (rewardTxt?' ':'') + '💎' + a.reward.crystals;
      if (a.reward.researchPoints) rewardTxt += (rewardTxt?' ':'') + '🔬' + a.reward.researchPoints;
      html += '<div class="achievement ' + (done?'done':'') + '"><div class="ach-emoji">' + (done ? a.emoji : '🔒') + '</div>' +
        '<div class="ach-info"><p>' + a.name + '</p><small>' + a.desc + '</small></div>' +
        '<div class="ach-reward">' + (done ? '✓' : rewardTxt) + '</div></div>';
    }
    UI.modal('🏆 Достижения (' + s.achievements.length + '/' + Achievements.LIST.length + ')', html);
  }
  /* ============ ЕЖЕДНЕВКА ============ */
  function openDaily(){
    if (!Unlocks.isUnlocked('daily')) { UI.toast('🔒 Нужен уровень ' + Unlocks.requiredLevel('daily')); return; }
    var s = State.get();
    var can = Daily.canClaim();
    var currentDay = s.daily.streak % 7;
    var days = '';
    for (var i = 0; i < Daily.REWARDS.length; i++) {
      var r = Daily.REWARDS[i];
      var claimed = i < currentDay;
      var isCurrent = i === currentDay && can;
      var showVal = r.credits ? ('💰' + r.credits) : ('💎' + r.crystals);
      if (r.credits && r.crystals) showVal = r.credits + '💎' + r.crystals;
      days += '<div class="daily-day ' + (claimed?'claimed':'') + ' ' + (isCurrent?'current':'') + '">' +
        '<div class="dnum">Д' + (i+1) + '</div>' +
        '<div class="dreward">' + (claimed ? '✓' : (i === 6 ? '🎁' : '📦')) + '</div>' +
        '<div class="dval">' + showVal + '</div></div>';
    }
    var btn = can ? '<button id="claimDailyBtn" style="width:100%;margin-top:16px;padding:14px;border-radius:14px;background:linear-gradient(135deg,#57e5ad,#54d9ff);color:#051a1a;font-size:13px;font-weight:900">🎁 Забрать</button>' : '<div style="text-align:center;margin-top:16px;padding:12px;background:#ffffff08;border-radius:12px;color:#7d84b0;font-size:11px">Заходи завтра</div>';
    UI.modal('🎁 Ежедневная награда',
      '<p style="color:#7d84b0;font-size:11px;text-align:center;margin-bottom:4px">Серия: <b style="color:#fff">' + s.daily.streak + '</b></p>' +
      '<div class="daily-grid">' + days + '</div>' + btn
    );
    var cb = document.getElementById('claimDailyBtn');
    if (cb) cb.onclick = function(){
      var r = Daily.claim();
      if (r.ok) {
        var parts = [];
        if (r.reward.credits) parts.push('💰+' + r.reward.credits);
        if (r.reward.crystals) parts.push('💎+' + r.reward.crystals);
        if (r.reward.researchPoints) parts.push('🔬+' + r.reward.researchPoints);
        UI.toast('🎁 ' + parts.join(' ')); UI.renderWallet(); openDaily();
      }
    };
  }
  /* ============ БУСТЫ ============ */
  function openBoosts(){
    if (!Unlocks.isUnlocked('boosts')) { UI.toast('🔒 Нужен уровень ' + Unlocks.requiredLevel('boosts')); return; }
    var s = State.get();
    var active = Economy.isBoosting();
    var html = '';
    for (var i = 0; i < BOOSTS.length; i++) {
      var b = BOOSTS[i];
      html += '<div class="boost-card ' + (active?'active':'') + '"><div class="boost-info"><p>' + b.name + '</p><small>' + b.desc + '</small></div>' +
        (active ? '<button disabled>АКТИВЕН</button>' : '<button data-b="' + b.id + '"' + (s.crystals<b.price?' disabled':'') + '>💎 ' + b.price + '</button>') + '</div>';
    }
    UI.modal('⚡ Бусты', html);
    var btns = document.querySelectorAll('[data-b]');
    for (i = 0; i < btns.length; i++) btns[i].onclick = function(){
      var r = Economy.buyBoost(this.getAttribute('data-b'));
      if (r.ok) { UI.toast('⚡ Активирован!'); UI.renderWallet(); UI.renderShip(); openBoosts(); }
      else if (r.reason === 'no_crystals') UI.toast('💎 Нужно ' + r.need);
    };
  }
  /* ============ МАГАЗИН ============ */
  function openShop(){
    if (!Unlocks.isUnlocked('shop')) { UI.toast('🔒 Нужен уровень ' + Unlocks.requiredLevel('shop')); return; }
    var html = '';
    for (var i = 0; i < SHOP_ITEMS.length; i++) {
      var item = SHOP_ITEMS[i];
      html += '<div class="shopitem"><div class="info"><p>' + item.name + '</p><small>' + item.desc + '</small></div>' +
        '<button data-shop="' + item.id + '">⭐ ' + item.price + '</button></div>';
    }
    UI.modal('💎 Магазин', html +
      '<div style="margin-top:16px;padding:11px;background:#00000040;border-radius:12px;font-size:10px;color:#7d84b0;text-align:center;line-height:1.5">Покупки через Telegram Stars</div>'
    );
    var btns = document.querySelectorAll('[data-shop]');
    for (i = 0; i < btns.length; i++) btns[i].onclick = function(){
      var itemId = this.getAttribute('data-shop');
      var item = null;
      for (var k = 0; k < SHOP_ITEMS.length; k++) if (SHOP_ITEMS[k].id === itemId) item = SHOP_ITEMS[k];
      if (!item) return;
      if (!tg || !tg.openInvoice) {
        var s = State.get();
        if (item.type === 'currency' && item.payload && item.payload.crystals) s.crystals += item.payload.crystals;
        else if (item.type === 'energy_full') { var st = Economy.getEffectiveStats(); Economy.setEnergy(st.energyMax); }
        s.purchases.push({ id: itemId, ts: Date.now() });
        State.save();
        UI.toast('✅ Получено'); UI.renderWallet(); UI.renderShip(); openShop();
        return;
      }
      UI.toast('⭐ Платёж через Stars — позже');
    };
  }
  /* ============ СТАТИСТИКА ============ */
  function openStats(){
    var s = State.get();
    var rank = Economy.getRank();
    UI.modal('📊 Статистика',
      '<div style="text-align:center;margin-bottom:14px;padding:12px;background:linear-gradient(90deg,#8b72ff22,#54d9ff22);border-radius:14px;border:1px solid #8b72ff44">' +
        '<div style="font-size:32px">' + rank.badge + '</div>' +
        '<div style="font-size:14px;font-weight:900;margin-top:4px">' + rank.name + '</div></div>' +
      '<div class="grid">' +
        '<div class="stat"><small>Уровень</small><b>' + s.level + '</b></div>' +
        '<div class="stat"><small>Экспедиций</small><b>' + UI.fmt(s.stats.mines) + '</b></div>' +
        '<div class="stat"><small>Продаж</small><b>' + UI.fmt(s.stats.sold) + '</b></div>' +
        '<div class="stat"><small>Переработок</small><b>' + UI.fmt(s.stats.refined) + '</b></div>' +
        '<div class="stat"><small>Рулеток</small><b>' + UI.fmt(s.stats.ruleta) + '</b></div>' +
        '<div class="stat"><small>Событий</small><b>' + UI.fmt(s.stats.events) + '</b></div>' +
        '<div class="stat"><small>💰 Заработано</small><b>' + UI.fmt(s.stats.totalEarned) + '</b></div>' +
        '<div class="stat"><small>🛸 Кораблей</small><b>' + s.ships.length + '/' + SHIPS.length + '</b></div>' +
        '<div class="stat"><small>🔬 Исследований</small><b>' + s.research.length + '/' + RESEARCH_TREE.length + '</b></div>' +
        '<div class="stat"><small>🏆 Достижений</small><b>' + s.achievements.length + '/' + Achievements.LIST.length + '</b></div>' +
      '</div>'
    );
  }
  /* ============ ЕЩЁ ============ */
  function openMore(){
    var btnStyle = 'padding:14px;border-radius:14px;font-weight:800;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;position:relative';
    function btn(id, icon, label, unlocked, color) {
      var lock = !unlocked ? '<span style="position:absolute;top:6px;right:8px;font-size:12px">🔒</span>' : '';
      var opacity = !unlocked ? 'opacity:0.5;' : '';
      return '<button id="' + id + '" style="' + btnStyle + ';' + opacity + 'background:' + (color||'linear-gradient(180deg,#ffffff10,#ffffff05)') + ';border:1px solid #ffffff1a">' + lock + '<span style="font-size:22px">' + icon + '</span>' + label + '</button>';
    }
    UI.modal('☰ Меню',
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
        btn('mDaily', '🎁', 'Ежедневка', Unlocks.isUnlocked('daily'), 'linear-gradient(135deg,#57e5ad20,#54d9ff20)') +
        btn('mContracts', '📜', 'Контракты', Unlocks.isUnlocked('contracts'), 'linear-gradient(135deg,#ffd96620,#f5a62320)') +
        btn('mBoosts', '⚡', 'Бусты', Unlocks.isUnlocked('boosts'), 'linear-gradient(135deg,#ff7bd520,#8b72ff20)') +
        btn('mRuleta', '🎰', 'Рулетка', Unlocks.isUnlocked('ruleta'), 'linear-gradient(135deg,#ff7bd520,#ffd96620)') +
        btn('mQuests', '📋', 'Квесты', Unlocks.isUnlocked('quests')) +
        btn('mAch', '🏆', 'Достижения', Unlocks.isUnlocked('achievements')) +
        btn('mModules', '🧩', 'Модули', Unlocks.isUnlocked('modules')) +
        btn('mResearch', '🔬', 'Древо исследований', Unlocks.isUnlocked('research')) +
        btn('mRefinery', '⚗️', 'Переработка', Unlocks.isUnlocked('refinery')) +
        btn('mUpgrades', '🔧', 'Апгрейды', Unlocks.isUnlocked('upgrades')) +
        btn('mShop', '💎', 'Магазин', Unlocks.isUnlocked('shop')) +
        btn('mStats', '📊', 'Статистика', true) +
      '</div>'
    );
    // Как только открыли меню — считаем открытия просмотренными
    try {
      var s = State.get();
      if (s.pendingUnlocks.length > 0) {
        s.pendingUnlocks = [];
        State.save();
        UI.renderNavLocks();
      }
    } catch (e) {}
    function bind(id, fn){ var el = document.getElementById(id); if (el) el.onclick = safe(fn); }
    bind('mDaily', openDaily);
    bind('mContracts', openContracts);
    bind('mBoosts', openBoosts);
    bind('mRuleta', openRuleta);
    bind('mQuests', openQuests);
    bind('mAch', openAchievements);
    bind('mModules', openModules);
    bind('mResearch', openResearch);
    bind('mRefinery', openRefinery);
    bind('mUpgrades', openUpgrades);
    bind('mShop', openShop);
    bind('mStats', openStats);
  }
  function changeSector(dir){
    var s = State.get();
    var curIdx = -1;
    for (var i = 0; i < SECTORS.length; i++) if (SECTORS[i].id === s.sector) curIdx = i;
    var nextIdx = curIdx + dir;
    if (nextIdx < 0 || nextIdx >= SECTORS.length) return;
    var next = SECTORS[nextIdx];
    if (!SectorLocks.canUnlock(next)) {
      var req = SectorLocks.requirementText(next);
      if (s.level < next.minLevel) UI.toast('🔒 Нужен уровень ' + next.minLevel);
      else if (req) UI.toast('🔒 Требуется: ' + req);
      return;
    }
    s.sector = next.id;
    s.selected = 0;
    State.save();
    UI.renderAll();
    UI.toast('🌌 ' + next.name);
    haptic('heavy');
  }
  function startBackgroundTicks(){
    setInterval(function(){
      try {
        Economy.applyEnergyRegen();
        UI.renderShip();
        UI.renderEvent();
        if (Events.tick()) UI.renderEvent();
      } catch (e) {}
    }, 1000);
    setInterval(function(){ try { State.save(); } catch (e) {} }, CONFIG.SAVE_INTERVAL);
    setInterval(function(){ try { if (Market.update()) UI.toast('📈 Биржа!'); } catch (e) {} }, 60000);
    setInterval(function(){
      try {
        var r = Events.trySpawn();
        if (r) { UI.toast(r.instant ? r.msg : r.event.name + '!'); UI.renderEvent(); }
      } catch (e) {}
    }, 30000);
    setInterval(function(){ try { Contracts.generate(); Quests.generate(); } catch (e) {} }, 300000);
  }
  function init(){
    try {
      State.load();
      Economy.applyEnergyRegen();
      var offline = Economy.applyOfflineIncome();
      Quests.generate();
      Contracts.generate();
      Market.update();
      Events.trySpawn();
      Unlocks.checkNewUnlocks(0);
      var initialAch = Achievements.check();
      UI.renderAll();
      if (offline) setTimeout(function(){ UI.toast('💤 Офлайн ' + offline.hours + ' ч • 💰 +' + fmtBig(offline.credits)); }, 700);
      if (initialAch.length) setTimeout(function(){ UI.toast('🏆 Достижений: ' + initialAch.length); }, 1400);
      var s = State.get();
      if (s.mining) {
        var elapsed = (Date.now() - s.mining.started) / 1000;
        if (elapsed >= s.mining.duration) finishMining();
        else startTimer();
      }
      setTimeout(function(){ Tutorial.update(); }, 1200);
    } catch (e) {
      console.error('Init error:', e);
      UI.toast('Ошибка: ' + e.message);
    }
    var bindings = [
      ['btnMine', function(){ UI.closeModal(); window.scrollTo(0, 0); }],
      ['btnInventory', openInventory],
      ['btnMarket', openMarket],
      ['btnFleet', openFleet],
      ['btnMore', openMore],
      ['mineBtn', startMining],
      ['closeBtn', UI.closeModal],
      ['upCloseBtn', function(){ UI.closeUnlockPopup(); setTimeout(showUnlockQueue, 300); }],
      ['tutorialClose', function(){ Tutorial.close(); }],
      ['sectorPrev', function(){ changeSector(-1); }],
      ['sectorNext', function(){ changeSector(1); }]
    ];
    for (var i = 0; i < bindings.length; i++) {
      var el = $(bindings[i][0]);
      if (el) el.onclick = safe(bindings[i][1]);
    }
    var modal = $('modal');
    if (modal) modal.onclick = function(e){ if (e.target === modal) UI.closeModal(); };
    try {
      if (tg) {
        if (tg.ready) tg.ready();
        if (tg.expand) tg.expand();
        if (tg.BackButton && tg.BackButton.onClick) {
          tg.BackButton.onClick(function(){
            if (UI.isModalOpen()) UI.closeModal();
            else if (tg.close) tg.close();
          });
          if (tg.BackButton.show) tg.BackButton.show();
        }
      }
    } catch (e) {}
    document.addEventListener('visibilitychange', function(){
      if (document.hidden) State.save();
      else {
        try {
          Economy.applyEnergyRegen();
          Economy.applyOfflineIncome();
          Market.update();
          Events.trySpawn();
          UI.renderAll();
          Tutorial.update();
          if (State.get().mining) startTimer();
        } catch (e) {}
      }
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape') {
        if (UI.isModalOpen()) UI.closeModal();
        var up = $('unlockPopup');
        if (up && up.classList.contains('show')) UI.closeUnlockPopup();
      }
    });
    startBackgroundTicks();
  }
  return { init: init, haptic: haptic };
})();
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', App.init);
} else {
  App.init();
}
})();
</script>
</body>
</html>
